backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/img"

collections:

  # Choreography — one JSON file per dance in src/_data/choreography/
  - name: "choreography"
    label: "Choreography"
    folder: "src/_data/choreography"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Formation (e.g. Duple Minor - Becket)", name: "formation", widget: "string" }
      - { label: "Progression (e.g. Single Progression)", name: "progression", widget: "string", required: false }
      - { label: "Date Written", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Co-author name", name: "co-author", widget: "string", required: false }
      - { label: "Co-author URL", name: "co-author-url", widget: "string", required: false }
      - label: "Figures"
        name: "figures"
        widget: "list"
        fields:
          - { label: "Section (A1, A2, B1, B2)", name: "section", widget: "string" }
          - { label: "Moves (one per line)", name: "moves", widget: "list" }
      - { label: "Notes (one per entry)", name: "notes", widget: "list", required: false }
      - label: "Videos"
        name: "videos"
        widget: "list"
        required: false
        fields:
          - { label: "Label (e.g. Lake City Contra Dance, 2025)", name: "label", widget: "string" }
          - { label: "YouTube URL", name: "url", widget: "string" }

  # Pages — editable data files for home and about
  - name: "pages"
    label: "Pages"
    files:

      - label: "Home Page"
        name: "home"
        file: "src/_data/home.json"
        fields:
          - { label: "Hero title", name: "title", widget: "string" }
          - { label: "Hero body text", name: "body", widget: "string" }
          - { label: "Hero image", name: "image", widget: "image", required: false }
          - { label: "Hero image alt text", name: "image_alt", widget: "string", required: false }
          - { label: "Photo credit", name: "photo_credit", widget: "string", required: false }
          - label: "Featured videos"
            name: "videos"
            widget: "list"
            required: false
            fields:
              - { label: "YouTube video ID", name: "youtube_id", widget: "string" }
              - { label: "Title (Dance by Choreographer)", name: "title", widget: "string" }
              - { label: "Event (e.g. Lake City Contra Dance, August 2025)", name: "event", widget: "string" }

      - label: "About Page"
        name: "about"
        file: "src/_data/about.json"
        fields:
          - { label: "Photo", name: "image", widget: "image", required: false }
          - { label: "Photo alt text", name: "image_alt", widget: "string", required: false }
          - { label: "Photo credit", name: "photo_credit", widget: "string", required: false }
